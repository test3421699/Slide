<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/pwa-icon.png" />
    <link rel="apple-touch-icon" href="/pwa-icon.png" />
    <title>SlideCraft AI - Presentation Deck Builder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then((reg) => console.log('SlideCraft ServiceWorker registered successfully:', reg.scope))
            .catch((err) => console.error('SlideCraft ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
